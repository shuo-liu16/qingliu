<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F6F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="清流">
<meta name="description" content="清流 · 每天读这一页就够了。多源聚合、自动去重、按兴趣排序的信息精选。">
<title>清流 · 信息太多，读这一页</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">

  <header class="topbar" id="topbar">
    <div class="topbar__left">
      <div class="wordmark">
        <span class="wordmark__seal">清</span>
        <div class="wordmark__text">
          <h1>清流</h1>
          <p id="todayLabel">—</p>
        </div>
      </div>
    </div>
    <button class="iconbtn" id="btnRefresh" aria-label="刷新">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/>
      </svg>
    </button>
  </header>

  <main id="main">
    <!-- 今日 -->
    <section class="view" id="view-today">
      <div id="todayBody"></div>
    </section>

    <!-- 全部 -->
    <section class="view" id="view-all" hidden>
      <div class="filters" id="filters"></div>
      <div class="feedhead" id="feedhead"></div>
      <div id="feedBody"></div>
    </section>

    <!-- 我的 -->
    <section class="view" id="view-me" hidden>
      <div id="meBody"></div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab is-active" data-view="today">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H19v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M8 8h7M8 12h7M8 16h4"/>
      </svg>
      <span>今日</span>
    </button>
    <button class="tab" data-view="all">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16M4 12h16M4 17h10"/>
      </svg>
      <span>全部</span>
    </button>
    <button class="tab" data-view="me">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c1.2-3.8 3.8-5.6 7-5.6s5.8 1.8 7 5.6"/>
      </svg>
      <span>我的</span>
    </button>
  </nav>

  <div class="sheet-mask" id="sheetMask" hidden></div>
  <div class="sheet" id="sheet" hidden>
    <div class="sheet__grab"></div>
    <div class="sheet__scroll" id="sheetBody"></div>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>

<script src="app.js"></script>
</body>
</html>
